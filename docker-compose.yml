services:
  bot:
    build: .
    container_name: persian-media-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/bot.sqlite3
    volumes:
      - bot-data:/app/data
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bot-data:
